<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07071A;--surface:#0D0D22;--card:#111128;--card2:#16163A;
  --b1:#1A1A3A;--b2:#252550;
  --violet:#7B6EE8;--vlo:#1A173C;--vhi:#B0A4FF;
  --teal:#2DD4A8;--coral:#E8582F;--rose:#D44A76;
  --amber:#E09525;--sky:#389AE6;--lime:#65AE1E;
  --tx:#ECEAF8;--muted:#76748E;--faint:#2A2845;
  --r:10px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}

/* ── TOP HEADER ── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.25rem;height:52px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--b1);gap:1rem;
}
.hdr-brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.hdr-logo{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,var(--violet),var(--teal));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:#fff;
}
.hdr-name{font-size:14px;font-weight:700;letter-spacing:-.3px}
.hdr-name em{color:var(--vhi);font-style:normal}
.hdr-by{font-size:10px;color:var(--muted);white-space:nowrap}
.hdr-tabs{display:flex;gap:4px;overflow-x:auto;flex:1;padding:0 .5rem}
.hdr-tabs::-webkit-scrollbar{display:none}
.htab{
  display:flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:6px;cursor:pointer;
  font-size:12px;font-weight:500;white-space:nowrap;
  border:1px solid transparent;color:var(--muted);transition:all .15s;flex-shrink:0;
}
.htab:hover{color:var(--tx);background:var(--card)}
.htab.active{color:var(--tx);background:var(--card);border-color:var(--b2)}
.htab-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.htab-num{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted)}
.htab-close{margin-left:3px;color:var(--muted);font-size:11px;line-height:1;padding:0 2px;border-radius:3px}
.htab-close:hover{color:var(--rose);background:rgba(212,74,118,.15)}

/* ── WORKSPACE ── */
.workspace{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── AGENT WINDOW ── */
.agent-win{display:none;flex:1;flex-direction:column;overflow:hidden;height:100%}
.agent-win.active{display:flex}

.awin-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.25rem;flex-shrink:0;
  background:var(--card);border-bottom:1px solid var(--b1);gap:1rem;
}
.awin-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.awin-desc{font-size:11.5px;color:var(--muted);margin-top:1px}
.awin-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.lbadge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid;letter-spacing:.04em}
.btn-sm{
  font-size:11.5px;padding:5px 12px;border-radius:6px;
  border:1px solid var(--b2);background:transparent;color:var(--muted);
  cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .15s;
}
.btn-sm:hover{border-color:var(--violet);color:var(--tx)}
.btn-sm.danger:hover{border-color:var(--rose);color:var(--rose)}

/* ── SPLIT PANE ── */
.awin-body{flex:1;display:flex;overflow:hidden}

.awin-left{
  width:340px;flex-shrink:0;display:flex;flex-direction:column;
  border-right:1px solid var(--b1);background:var(--card);overflow-y:auto;
}
.awin-left::-webkit-scrollbar{width:3px}
.awin-left::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

.input-section{padding:1rem 1.1rem;flex:1}
.input-section h4{
  font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.9rem;
}
.field{margin-bottom:.85rem}
.field label{
  display:block;font-size:10.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;
}
.field input,.field textarea{
  width:100%;background:var(--card2);border:1px solid var(--b2);
  color:var(--tx);border-radius:7px;padding:8px 10px;
  font-family:'Space Grotesk',sans-serif;font-size:12.5px;
  outline:none;transition:border-color .2s;resize:vertical;
}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.field input:focus,.field textarea:focus{border-color:var(--violet)}
.field textarea{min-height:72px;line-height:1.5}

.run-section{
  padding:.85rem 1.1rem;border-top:1px solid var(--b1);
  background:var(--card2);flex-shrink:0;
}
.btn-run{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px;border-radius:8px;background:var(--violet);color:#fff;
  font-size:13.5px;font-weight:600;border:none;cursor:pointer;
  font-family:'Space Grotesk',sans-serif;transition:opacity .15s,transform .1s;
}
.btn-run:hover{opacity:.88;transform:translateY(-1px)}
.btn-run:disabled{opacity:.35;cursor:not-allowed;transform:none}
.manual-note{
  margin-top:.65rem;display:flex;align-items:flex-start;gap:6px;
  font-size:11px;color:var(--amber);line-height:1.5;
  padding:7px 9px;border-radius:6px;
  background:rgba(224,149,37,.07);border:1px solid rgba(224,149,37,.2);
}

/* ── OUTPUT ── */
.awin-right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.output-scroll{flex:1;overflow-y:auto;padding:1.1rem}
.output-scroll::-webkit-scrollbar{width:4px}
.output-scroll::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

.empty-wrap{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:.7rem;opacity:.45;text-align:center;padding:2rem;
}
.empty-wrap .ei{font-size:2.5rem}
.empty-wrap .et{font-size:15px;font-weight:600;color:var(--muted)}
.empty-wrap .es{font-size:12px;color:var(--muted);line-height:1.6;max-width:280px}

.out-block{background:var(--card);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;margin-bottom:.9rem}
.out-hdr{display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;background:var(--card2);border-bottom:1px solid var(--b1)}
.out-hdr-l{font-size:11px;font-weight:600;color:var(--vhi)}
.out-hdr-r{display:flex;gap:6px;align-items:center}
.out-ts{font-size:10.5px;color:var(--muted)}
.btn-copy,.btn-del{
  font-size:10.5px;padding:3px 9px;border-radius:5px;
  border:1px solid var(--b2);background:transparent;
  color:var(--muted);cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .15s;
}
.btn-copy:hover{border-color:var(--violet);color:var(--tx)}
.btn-del:hover{border-color:var(--rose);color:var(--rose)}

.out-body{padding:1rem 1.1rem;font-size:13px;line-height:1.75;color:var(--tx)}
.out-body h1,.out-body h2,.out-body h3{font-weight:700;letter-spacing:-.3px;margin:1.1em 0 .4em;color:var(--vhi)}
.out-body h1{font-size:1.15em}.out-body h2{font-size:1.05em}.out-body h3{font-size:.97em}
.out-body p{margin-bottom:.75em}
.out-body ul,.out-body ol{margin:.4em 0 .75em 1.3em}
.out-body li{margin-bottom:.25em}
.out-body table{width:100%;border-collapse:collapse;margin:.8em 0;font-size:12px}
.out-body th{background:var(--card2);padding:7px 10px;text-align:left;font-weight:600;border:1px solid var(--b2);color:var(--vhi)}
.out-body td{padding:6px 10px;border:1px solid var(--b1);vertical-align:top}
.out-body tr:hover td{background:rgba(123,110,232,.04)}
.out-body code{background:var(--card2);border:1px solid var(--b1);padding:1px 5px;border-radius:4px;font-family:'Space Mono',monospace;font-size:11px;color:var(--teal)}
.out-body pre{background:var(--card2);border:1px solid var(--b1);border-radius:8px;padding:.9rem;overflow-x:auto;margin:.75em 0}
.out-body pre code{background:none;border:none;padding:0;font-size:11.5px}
.out-body strong{font-weight:600;color:var(--tx)}
.out-body blockquote{border-left:2px solid var(--violet);padding-left:.9rem;color:var(--muted);margin:.75em 0}
.out-body hr{border:none;border-top:1px solid var(--b1);margin:1em 0}

.thinking{
  display:flex;align-items:center;gap:10px;
  padding:.9rem 1rem;margin-bottom:.9rem;
  background:rgba(123,110,232,.06);
  border:1px dashed var(--b2);border-radius:8px;
  font-size:12.5px;color:var(--muted);
}
.spin{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--b2);border-top-color:var(--violet);
  animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── HOME ── */
.home-win{display:none;flex:1;overflow-y:auto;justify-content:center;padding:2rem 1rem}
.home-win.active{display:flex}
.home-inner{max-width:900px;width:100%}
.home-h{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;letter-spacing:-.8px;margin-bottom:.4rem}
.home-h em{color:var(--vhi);font-style:normal}
.home-sub{font-size:14px;color:var(--muted);margin-bottom:2rem;line-height:1.65;max-width:600px}
.home-section-label{
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--b1);
}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px;margin-bottom:2rem}
.home-card{
  background:var(--card);border:1px solid var(--b1);border-radius:var(--r);
  padding:.9rem;cursor:pointer;transition:border-color .18s,transform .15s;
  position:relative;overflow:hidden;
}
.home-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--cc,var(--violet))}
.home-card:hover{border-color:var(--cc,var(--violet));transform:translateY(-2px)}
.hc-num{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;color:var(--cc,var(--violet));margin-bottom:.35rem}
.hc-name{font-size:13px;font-weight:600;margin-bottom:.2rem}
.hc-desc{font-size:11px;color:var(--muted);line-height:1.45}
.hc-layer{display:inline-block;margin-top:.55rem;font-size:9.5px;padding:2px 7px;border-radius:20px;background:var(--faint);color:var(--muted)}

/* ── WORKFLOW STEPS ── */
.wf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:2rem}
.wf-card{
  background:var(--card);border:1px solid var(--b1);border-radius:var(--r);
  padding:.75rem .9rem;cursor:pointer;transition:border-color .15s;
  display:flex;align-items:flex-start;gap:10px;
}
.wf-card:hover{border-color:var(--b2)}
.wf-step-num{
  font-family:'Space Mono',monospace;font-size:18px;font-weight:700;
  color:var(--b2);line-height:1;flex-shrink:0;margin-top:2px;
}
.wf-step-name{font-size:12px;font-weight:600;line-height:1.3}
.wf-step-why{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:1.25rem;right:1.25rem;z-index:999;
  background:var(--card2);border:1px solid var(--b2);
  padding:9px 16px;border-radius:8px;font-size:12.5px;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}

/* ── MOBILE ── */
@media(max-width:640px){
  .awin-body{flex-direction:column}
  .awin-left{width:100%;max-height:45vh;border-right:none;border-bottom:1px solid var(--b1)}
  .hdr-by{display:none}
}
</style>

<script>
// ── AGENTS ────────────────────────────────────────────────────────
const AGENTS = [
  {
    idx:0,num:'01',name:'Prompt Research',
    desc:'Buyer questions people actually ask AI',
    layer:'Research',lc:'#7B6EE8',
    inputs:[
      {k:'brand',l:'Brand / Product / Topic',t:'text',p:'e.g. uprisingviews.com — Hindi personal finance blog'},
      {k:'audience',l:'Target Audience',t:'text',p:'e.g. 25-35 salaried Indians, beginner investors'},
      {k:'market',l:'Market & Language',t:'text',p:'e.g. India, Hindi + English (Hinglish)'},
      {k:'competitors',l:'Competitors (optional)',t:'text',p:'e.g. ET Money, Groww blog, Paisabazaar'},
      {k:'funnel',l:'Funnel Stages',t:'text',p:'all  OR  awareness, consideration, decision'},
    ],
    sys:`You are an AI Search Query Research Specialist. Uncover exact natural-language questions real buyers type into ChatGPT, Perplexity, Gemini, Claude — NOT Google keywords.

For each funnel stage (Awareness, Consideration, Decision, Post-Purchase), generate 8-12 realistic AI prompts — conversational, personalized ("for me", "I have X budget").

Include: comparison prompts, "best for me" prompts, troubleshooting, and trust prompts ("is X legit").

For each prompt output: Intent type | Why AI would answer confidently | Content Target to build.

Flag TOP 10 highest-priority prompts (most likely asked + result in AI naming a brand).

If bilingual market, include natural code-switched phrasings (e.g. Hinglish).

OUTPUT — markdown tables:
## [Funnel Stage]
| AI Prompt | Intent Type | Content Target |

## Top 10 Priority Prompts
| Prompt | Why Priority |

No filler. Lead with tables.`,
    msg:f=>`Brand/Topic: ${f.brand}\nAudience: ${f.audience}\nMarket & Language: ${f.market}\nCompetitors: ${f.competitors||'not specified'}\nFunnel Stages: ${f.funnel||'all'}`
  },
  {
    idx:1,num:'02',name:'AI Content Strategy',
    desc:'Topical authority map built for LLM retrieval',
    layer:'Research',lc:'#2DD4A8',
    inputs:[
      {k:'brand',l:'Brand / Site + Niche',t:'text',p:'e.g. uprisingviews.com — Hindi personal finance'},
      {k:'pillar',l:'Core Pillar Topic',t:'text',p:'e.g. SIP investing for beginners in India'},
      {k:'existing',l:'Existing Content (URLs/titles or "none")',t:'textarea',p:'List your existing articles, or type "none"'},
      {k:'market',l:'Target Market & Language',t:'text',p:'e.g. India, English + Hindi'},
    ],
    sys:`You are a Topical Authority Architect specializing in content AI engines retrieve and cite.

Build complete topic universe: pillar + every sub-entity, sub-topic, comparison, and question angle needed.

3-level hierarchy: Pillar → Cluster → Sub-topic.

For each item: Working title | Core entity/question | Content format | Internal link targets.

E-E-A-T trust signal assets needed (about page, methodology, original data).

If existing content provided, mark each: Cover / Update / New.

Weekly publishing roadmap ordered by: (a) biggest topical gap, (b) best internal linking, (c) highest buyer-intent.

OUTPUT:
## Topic Universe (nested list, 3 levels)
## Roadmap
| Week | Title | Cluster | Core Question | Format | Status |
## Trust Signal Assets`,
    msg:f=>`Brand/Site: ${f.brand}\nPillar Topic: ${f.pillar}\nExisting Content: ${f.existing||'none'}\nMarket: ${f.market}`
  },
  {
    idx:2,num:'03',name:'GEO On-Page Editor',
    desc:'Rewrites pages so AI can extract and cite them',
    layer:'Content',lc:'#E8582F',
    inputs:[
      {k:'query',l:'Primary Query This Page Should Win',t:'text',p:'e.g. best SIP plan for beginners India 2025'},
      {k:'brand',l:'Brand Name & Tone Notes',t:'text',p:'e.g. uprisingviews.com — conversational, Hinglish-friendly'},
      {k:'content',l:'Page Content (paste full text)',t:'textarea',p:'Paste your entire page content here…'},
    ],
    sys:`You are a GEO (Generative Engine Optimization) On-Page Editor. Rewrite page content so AI engines can extract, understand, and cite it without losing brand voice.

Rules:
1. Open with 40-60 word Direct Answer — plain, third-person, citable (no "we/our").
2. Convert headers to natural-language questions (H2/H3) matching AI prompts.
3. Self-contained 2-4 sentence chunks (no dangling pronouns).

let openTabs = [];
try{ openTabs=JSON.parse(localStorage.getItem(TK)||'[]'); }catch(e){}
let activeWin='home';

function saveTabs(){ localStorage.setItem(TK,JSON.stringify(openTabs)); }

function showHome(){
  setActive('home');
}

function openAgent(idx){
  if(!openTabs.includes(idx)){
    openTabs.push(idx);
    saveTabs();
    buildTab(idx);
  }
  setActive('a'+idx);
}

function buildTab(idx){
  const ag=AGENTS[idx];
  if(document.getElementById('tab-a'+idx)) return;
  const tab=document.createElement('div');
  tab.className='htab';
  tab.id='tab-a'+idx;
  tab.setAttribute('role','tab');
  tab.innerHTML=`<span class="htab-dot" style="background:${ag.lc}"></span>
    <span>${ag.name}</span>
    <span class="htab-num">${ag.num}</span>
    <span class="htab-close" onclick="closeTab(event,${idx})" title="Close">✕</span>`;
  tab.onclick=(e)=>{ if(!e.target.classList.contains('htab-close')) openAgent(idx); };
  hdrTabs.appendChild(tab);
}

function closeTab(e,idx){
  e.stopPropagation();
  openTabs=openTabs.filter(i=>i!==idx);
  saveTabs();
  document.getElementById('tab-a'+idx)?.remove();
  if(activeWin==='a'+idx) setActive('home');
}

function setActive(winId){
  activeWin=winId;
  document.querySelectorAll('.agent-win').forEach(w=>w.classList.remove('active'));
  document.getElementById('win-home').classList.remove('active');
  document.querySelectorAll('.htab').forEach(t=>{ t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
  if(winId==='home'){
    document.getElementById('win-home').classList.add('active');
    const ht=document.getElementById('tab-home');
    if(ht){ ht.classList.add('active'); ht.setAttribute('aria-selected','true'); }
  } else {
    const win=document.getElementById('win-'+winId);
    if(win) win.classList.add('active');
    const tab=document.getElementById('tab-'+winId);
    if(tab){ tab.classList.add('active'); tab.setAttribute('aria-selected','true'); }
  }
}

// restore tabs
openTabs.forEach(idx=>{ if(AGENTS[idx]) buildTab(idx); });
setActive('home');

function renderOutputs(idx){

  if(!outs.length){
    area.innerHTML=`<div class="empty-wrap">
      <div class="ei">${AGENTS[idx].num}</div>
      <div class="et">${AGENTS[idx].name}</div>
      <div class="es">Fill inputs on the left and hit Run Agent. Outputs are saved permanently.</div>
    </div>`;
    return;
  }
  area.innerHTML=outs.map(o=>`
    <div class="out-block">
      <div class="out-hdr">
        <span class="out-hdr-l">Agent ${AGENTS[idx].num} · ${AGENTS[idx].name}</span>
        <span class="out-hdr-r">

          <button class="btn-copy" onclick="copyOut(${idx},'${o.id}')">Copy</button>

        </span>
      </div>
      <div class="out-body">${o.html}</div>
    </div>`).join('');
}

function clearOutputs(idx){
  aStore(idx).outputs=[];
  saveStore();
  renderOutputs(idx);
}

function delOut(idx,oid){
  const s=aStore(idx);
  s.outputs=s.outputs.filter(o=>o.id!==oid);
  saveStore();
  renderOutputs(idx);
}

// ── RUN ──────────────────────────────────────────────────────────
const running={};
async function runAgent(idx){
  if(running[idx]) return;
  const ag=AGENTS[idx];
  const fields={};
  ag.inputs.forEach(inp=>{
    const el=document.getElementById(`f_${ag.idx}_${inp.k}`);
    fields[inp.k]=el?el.value.trim():'';
  });
  if(!fields[ag.inputs[0].k]){
    showToast('Fill in at least the first field');
    document.getElementById(`f_${ag.idx}_${ag.inputs[0].k}`)?.focus();
    return;
  }
  running[idx]=true;
  const btn=document.getElementById('btnRun'+idx);
  const ico=document.getElementById('btnIco'+idx);
  const txt=document.getElementById('btnTxt'+idx);
  if(btn) btn.disabled=true;
  if(ico) ico.innerHTML='<span class="spin"></span>';
  if(txt) txt.textContent='Running…';

  const area=document.getElementById('out'+idx);
  area.querySelector('.empty-wrap')?.remove();
  const tid='t'+Date.now();
  const tel=document.createElement('div');
  tel.id=tid; tel.className='thinking';
  tel.innerHTML=`<div class="spin"></div><span>Agent ${ag.num} · ${ag.name} running…</span>`;
  area.insertBefore(tel,area.firstChild);

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system:ag.sys,
        messages:[{role:'user',content:ag.msg(fields)}]
      })
    });
    const data=await resp.json();
    const raw=data.content?.map(b=>b.text||'').join('')||'No response.';
    const oid='o'+Date.now();
    const ts=new Date().toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    aStore(idx).outputs.unshift({id:oid,ts,raw,html:md2html(raw)});
    saveStore();
  }catch(err){
    const oid='o'+Date.now();
    const ts=new Date().toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    aStore(idx).outputs.unshift({id:oid,ts,raw:'',html:`<p style="color:var(--rose)">⚠ Error: ${err.message}</p>`});
    saveStore();
  }
  document.getElementById(tid)?.remove();
  running[idx]=false;
  if(btn) btn.disabled=false;
  if(ico) ico.textContent='⚡';
  if(txt) txt.textContent='Run Agent '+ag.num;
  renderOutputs(idx);
  if(area) area.scrollTop=0;
}

// ── COPY ─────────────────────────────────────────────────────────
function copyOut(idx,oid){
  const o=aStore(idx).outputs.find(x=>x.id===oid);
  if(o) navigator.clipboard.writeText(o.raw).then(()=>showToast('Copied ✓'));
}

// ── MARKDOWN → HTML ──────────────────────────────────────────────
function md2html(md){
  let h=md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/```[\w]*\n?([\s\S]*?)```/g,'<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^---+$/gm,'<hr/>')
    .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/((?:\|.+\|\n?)+)/g,tbl=>{
    const rows=tbl.trim().split('\n').filter(r=>r.trim());
    let out='<table>',body=false;
    rows.forEach((row,i)=>{
      if(/^\|[\s\-|:]+\|$/.test(row.trim())) return;
      const cells=row.split('|').filter((_,j,a)=>j>0&&j<a.length-1);
      if(i===0){out+='<thead><tr>'+cells.map(c=>`<th>${c.trim()}</th>`).join('')+'</tr></thead><tbody>';body=true;}
      else out+='<tr>'+cells.map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>';
    });
    return out+(body?'</tbody>':'')+'</table>';
  });
  h=h.replace(/^(\d+)\. (.+)$/gm,'<li class="_ol">$2</li>');
  h=h.replace(/^[-*] (.+)$/gm,'<li class="_ul">$2</li>');
  h=h.replace(/(<li class="_ol">[\s\S]*?<\/li>\n?)+/g,m=>`<ol>${m.replace(/ class="_ol"/g,'')}</ol>`);
  h=h.replace(/(<li class="_ul">[\s\S]*?<\/li>\n?)+/g,m=>`<ul>${m.replace(/ class="_ul"/g,'')}</ul>`);
  h=h.split(/\n\n+/).map(b=>{
    const t=b.trim();if(!t)return'';
    if(/^<(h[1-6]|ul|ol|table|pre|blockquote|hr)/.test(t))return t;
    return`<p>${t.replace(/\n/g,' ')}</p>`;
  }).join('\n');
  return h;
}

// ── TOAST ─────────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
